<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>Desert Order</title>
    <style>
      /* The overlay is paper: warm, thin, and quiet. It never fights the
         drawing underneath for attention — ink on a page, nothing more. */
      :root {
        --page: #efe7d5;
        --page2: #e6dcc6;
        --ink: #3d342b;
        --ink2: rgba(61, 52, 43, 0.62);
        --ink3: rgba(61, 52, 43, 0.3);
        --rule: rgba(61, 52, 43, 0.22);
        --rule2: rgba(61, 52, 43, 0.12);
        --good: #4a6a34;
        --warn: #9a6a1e;
        --bad: #9a4030;
        --sel: #e8dfc8;
        --font:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial,
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: var(--page2);
        font-family: var(--font);
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
        user-select: none;
        cursor: default;
      }

      #view {
        position: absolute;
        inset: 0;
        display: block;
        touch-action: none;
        cursor: crosshair;
      }

      .zs-ui {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 5;
      }
      .zs-ui button,
      .zs-ui canvas,
      .zs-ui .zs-panel,
      .zs-ui .zs-bottom,
      .zs-ui .zs-top,
      .zs-ui .zs-veil {
        pointer-events: auto;
      }

      /* ---------------------------------------------------------------- top */

      .zs-top {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 46px;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 0 12px;
        background: linear-gradient(180deg, rgba(239, 231, 213, 0.97), rgba(232, 223, 203, 0.94));
        border-bottom: 1px solid var(--rule);
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.4) inset,
          0 3px 10px rgba(61, 52, 43, 0.07);
      }

      .zs-res {
        display: flex;
        gap: 4px;
      }
      .zs-resbox {
        position: relative;
        display: flex;
        align-items: baseline;
        gap: 6px;
        padding: 4px 10px 4px 8px;
        border: 1px solid var(--rule2);
        border-radius: 3px;
        background: rgba(255, 253, 246, 0.5);
        min-width: 104px;
      }
      .zs-resbox.full {
        border-color: rgba(154, 64, 48, 0.55);
        background: rgba(214, 178, 164, 0.4);
      }
      .zs-restag {
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.09em;
      }
      .zs-resval {
        font-size: 15px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .zs-resrate {
        font-size: 10px;
        color: var(--ink2);
        font-variant-numeric: tabular-nums;
      }

      .zs-topmid {
        display: flex;
        flex-direction: column;
        gap: 2px;
        margin-left: 6px;
      }
      .zs-clock {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.06em;
        font-variant-numeric: tabular-nums;
      }
      .zs-topsub {
        display: flex;
        gap: 8px;
      }
      .zs-chip {
        font-size: 10px;
        letter-spacing: 0.07em;
        color: var(--ink2);
        font-weight: 600;
      }

      .zs-speed {
        margin-left: auto;
        display: flex;
        gap: 4px;
      }
      .zs-spbtn {
        min-width: 32px;
        height: 28px;
        padding: 0 8px;
        border: 1px solid var(--rule);
        background: rgba(255, 253, 246, 0.6);
        color: var(--ink);
        border-radius: 3px;
        font-family: var(--font);
        font-size: 11px;
        font-weight: 700;
        cursor: pointer;
      }
      .zs-spbtn:hover {
        background: #fffdf6;
        border-color: var(--ink3);
      }
      .zs-spbtn.on {
        background: var(--ink);
        color: var(--page);
        border-color: var(--ink);
      }

      /* -------------------------------------------------------------- panel */

      .zs-panel {
        position: absolute;
        top: 54px;
        right: 8px;
        width: 252px;
        max-height: calc(100% - 214px);
        display: flex;
        flex-direction: column;
        gap: 8px;
        background: linear-gradient(180deg, rgba(243, 236, 222, 0.96), rgba(233, 224, 206, 0.95));
        border: 1px solid var(--rule);
        border-radius: 4px;
        box-shadow: 0 6px 22px rgba(61, 52, 43, 0.1);
        padding: 10px;
        overflow: hidden;
      }
      .zs-panelbody {
        overflow-y: auto;
        overflow-x: hidden;
      }
      .zs-panelbody::-webkit-scrollbar {
        width: 7px;
      }
      .zs-panelbody::-webkit-scrollbar-thumb {
        background: var(--rule);
        border-radius: 4px;
      }

      .zs-sect {
        margin-bottom: 10px;
      }
      .zs-secthead {
        font-size: 9.5px;
        font-weight: 800;
        letter-spacing: 0.13em;
        color: var(--ink2);
        border-bottom: 1px solid var(--rule2);
        padding-bottom: 3px;
        margin-bottom: 5px;
      }
      .zs-secthead.zs-big {
        font-size: 13px;
        letter-spacing: 0.04em;
        color: var(--ink);
      }
      .zs-sub {
        font-size: 10px;
        color: var(--ink2);
        margin: -3px 0 6px;
        letter-spacing: 0.05em;
      }

      .zs-row {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font-size: 11.5px;
        padding: 1.5px 0;
      }
      .zs-rowk {
        color: var(--ink2);
      }
      .zs-rowv {
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }

      .zs-hpbar {
        height: 5px;
        background: rgba(61, 52, 43, 0.16);
        border-radius: 3px;
        overflow: hidden;
        margin: 3px 0 6px;
      }
      .zs-hpbar.zs-thin {
        height: 4px;
        width: 54px;
        margin: 0;
        flex: 0 0 54px;
      }
      .zs-hpfill {
        height: 100%;
        background: #5d8a4a;
        transition: width 0.15s linear;
      }

      .zs-rostrow {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 4px 5px;
        margin: 0 -5px;
        border-radius: 3px;
        cursor: pointer;
        font-size: 11.5px;
      }
      .zs-rostrow:hover {
        background: rgba(61, 52, 43, 0.07);
      }
      .zs-rostname {
        flex: 1;
      }
      .zs-rostn {
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        color: var(--ink2);
      }

      .zs-btns {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .zs-btn {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 5px 9px;
        border: 1px solid var(--rule);
        border-radius: 3px;
        background: rgba(255, 253, 246, 0.66);
        color: var(--ink);
        cursor: pointer;
        font-family: var(--font);
        font-size: 11px;
        font-weight: 600;
      }
      .zs-btn:hover {
        background: #fffdf6;
        border-color: var(--ink3);
      }
      .zs-btn:active {
        transform: translateY(1px);
      }
      .zs-btn.zs-danger {
        color: var(--bad);
        border-color: rgba(154, 64, 48, 0.35);
      }
      .zs-btn.zs-big {
        padding: 10px 22px;
        font-size: 13px;
        margin-top: 6px;
      }
      .zs-key {
        font-size: 9px;
        font-weight: 800;
        padding: 1px 4px;
        border-radius: 2px;
        background: rgba(61, 52, 43, 0.12);
        color: var(--ink2);
        letter-spacing: 0.04em;
      }

      .zs-tip {
        font-size: 10.5px;
        line-height: 1.45;
        color: var(--ink2);
        border-left: 2px solid var(--rule);
        padding: 2px 0 2px 7px;
        margin-top: 4px;
      }

      /* ------------------------------------------------------------- ledger */

      .zs-log {
        border-top: 1px solid var(--rule2);
        padding-top: 7px;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .zs-logrow {
        display: flex;
        gap: 6px;
        font-size: 10.5px;
        line-height: 1.35;
        color: var(--ink2);
      }
      .zs-logt {
        flex: 0 0 24px;
        font-weight: 700;
        color: var(--ink3);
      }
      .zs-logx {
        flex: 1;
      }
      .zs-logrow.zs-good .zs-logx {
        color: var(--good);
      }
      .zs-logrow.zs-warn .zs-logx {
        color: var(--warn);
      }
      .zs-logrow.zs-bad .zs-logx {
        color: var(--bad);
      }

      /* -------------------------------------------------------------- bottom */

      .zs-bottom {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 132px;
        display: flex;
        align-items: stretch;
        gap: 10px;
        padding: 8px 10px 10px;
        background: linear-gradient(0deg, rgba(239, 231, 213, 0.97), rgba(233, 224, 206, 0.86));
        border-top: 1px solid var(--rule);
        box-shadow: 0 -3px 12px rgba(61, 52, 43, 0.07);
      }

      .zs-mmframe {
        position: relative;
        flex: 0 0 auto;
        display: flex;
      }
      .zs-mini {
        display: block;
        border-radius: 3px;
        cursor: pointer;
      }
      .zs-mmlabel {
        position: absolute;
        left: 6px;
        bottom: 5px;
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 0.16em;
        color: rgba(61, 52, 43, 0.42);
      }

      .zs-cmd {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 0;
      }
      .zs-tabs {
        display: flex;
        gap: 4px;
      }
      .zs-tab {
        padding: 4px 12px;
        border: 1px solid var(--rule);
        border-bottom: none;
        border-radius: 3px 3px 0 0;
        background: rgba(255, 253, 246, 0.4);
        cursor: pointer;
        font-family: var(--font);
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.07em;
        color: var(--ink2);
      }
      .zs-tab:hover {
        background: rgba(255, 253, 246, 0.8);
        color: var(--ink);
      }
      .zs-tab.on {
        background: var(--ink);
        color: var(--page);
        border-color: var(--ink);
      }

      .zs-grid {
        flex: 1;
        display: flex;
        gap: 6px;
        overflow-x: auto;
        overflow-y: hidden;
        padding: 6px;
        border: 1px solid var(--rule2);
        border-radius: 3px;
        background: rgba(255, 253, 246, 0.34);
        align-items: stretch;
      }
      .zs-grid::-webkit-scrollbar {
        height: 7px;
      }
      .zs-grid::-webkit-scrollbar-thumb {
        background: var(--rule);
        border-radius: 4px;
      }

      .zs-cell {
        position: relative;
        flex: 0 0 78px;
        width: 78px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1px;
        padding: 4px 2px 5px;
        border: 1px solid var(--rule2);
        border-radius: 3px;
        background: rgba(255, 253, 246, 0.62);
        cursor: pointer;
        font-family: var(--font);
        color: var(--ink);
      }
      .zs-cell:hover {
        background: #fffdf6;
        border-color: var(--ink3);
      }
      .zs-cell.on {
        background: var(--sel);
        border-color: var(--good);
        box-shadow: 0 0 0 1px var(--good) inset;
      }
      .zs-cell:disabled {
        opacity: 0.42;
        cursor: not-allowed;
      }
      .zs-cellicon {
        display: block;
      }
      .zs-cellname {
        font-size: 10.5px;
        font-weight: 800;
        letter-spacing: 0.05em;
      }
      .zs-cellcost {
        font-size: 9.5px;
        color: var(--ink2);
        font-variant-numeric: tabular-nums;
        text-align: center;
        line-height: 1.2;
      }
      .zs-hk {
        position: absolute;
        top: 2px;
        right: 3px;
        font-size: 8.5px;
        font-weight: 800;
        color: var(--ink3);
        letter-spacing: 0.03em;
      }

      /* -------------------------------------------------------------- toasts */

      .zs-toasts {
        position: absolute;
        top: 56px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        gap: 5px;
        align-items: center;
        pointer-events: none;
        z-index: 8;
      }
      .zs-toast {
        padding: 6px 14px;
        border-radius: 3px;
        font-size: 12px;
        font-weight: 600;
        background: rgba(243, 236, 222, 0.96);
        border: 1px solid var(--rule);
        box-shadow: 0 4px 14px rgba(61, 52, 43, 0.14);
        animation: zsin 0.22s ease-out;
        transition:
          opacity 0.5s,
          transform 0.5s;
      }
      .zs-toast.zs-good {
        border-color: rgba(74, 106, 52, 0.5);
        color: var(--good);
      }
      .zs-toast.zs-warn {
        border-color: rgba(154, 106, 30, 0.5);
        color: var(--warn);
      }
      .zs-toast.zs-bad {
        border-color: rgba(154, 64, 48, 0.5);
        color: var(--bad);
      }
      .zs-toast.zs-out {
        opacity: 0;
        transform: translateY(-8px);
      }
      @keyframes zsin {
        from {
          opacity: 0;
          transform: translateY(-8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      .zs-pauseflag {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 30px;
        font-weight: 800;
        letter-spacing: 0.3em;
        color: rgba(61, 52, 43, 0.3);
        pointer-events: none;
      }

      /* ---------------------------------------------------------------- veils */

      .zs-veil {
        position: absolute;
        inset: 0;
        z-index: 20;
        background: rgba(233, 224, 206, 0.9);
        backdrop-filter: blur(2px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        pointer-events: auto;
        overflow-y: auto;
      }
      .zs-hidden {
        display: none;
      }

      .zs-help,
      .zs-result {
        width: min(1000px, 96vw);
        background: var(--page);
        border: 1px solid var(--rule);
        border-radius: 5px;
        box-shadow: 0 18px 60px rgba(61, 52, 43, 0.22);
        padding: 26px 30px 22px;
      }
      .zs-help h2,
      .zs-result h2 {
        margin: 0 0 6px;
        font-size: 21px;
        font-weight: 800;
        letter-spacing: 0.22em;
      }
      .zs-result h2 {
        letter-spacing: 0.14em;
      }
      .zs-lede {
        margin: 0 0 18px;
        font-size: 13px;
        line-height: 1.55;
        color: var(--ink2);
        max-width: 74ch;
      }

      .zs-helpcols {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(178px, 1fr));
        gap: 18px;
      }
      .zs-helpcol h3 {
        margin: 0 0 7px;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.14em;
        color: var(--ink);
      }
      .zs-helpcol dl {
        margin: 0;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 3px 9px;
      }
      .zs-helpcol dt {
        font-size: 11px;
        font-weight: 700;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      .zs-helpcol dd {
        margin: 0;
        font-size: 11px;
        color: var(--ink2);
        line-height: 1.4;
      }

      .zs-helprules {
        margin-top: 20px;
        border-top: 1px solid var(--rule2);
        padding-top: 14px;
      }
      .zs-helprules h3 {
        margin: 0 0 8px;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.14em;
      }
      .zs-helprules ul {
        margin: 0;
        padding-left: 18px;
      }
      .zs-helprules li {
        font-size: 12px;
        line-height: 1.6;
        color: var(--ink2);
        margin-bottom: 3px;
      }

      .zs-stat {
        text-align: center;
      }
      .zs-statv {
        font-size: 26px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }
      .zs-statk {
        font-size: 10px;
        letter-spacing: 0.13em;
        color: var(--ink2);
        font-weight: 700;
      }

      /* --------------------------------------------------------------- loading */

      #boot {
        position: absolute;
        inset: 0;
        z-index: 40;
        background: var(--page2);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 10px;
        font-size: 13px;
        letter-spacing: 0.18em;
        font-weight: 700;
        color: var(--ink2);
      }
      #boot .bar {
        width: 220px;
        height: 3px;
        background: var(--rule2);
        overflow: hidden;
        border-radius: 2px;
      }
      #boot .bar i {
        display: block;
        height: 100%;
        width: 30%;
        background: var(--ink2);
        animation: boot 1.1s ease-in-out infinite;
      }
      @keyframes boot {
        0% {
          margin-left: -30%;
        }
        100% {
          margin-left: 100%;
        }
      }

      @media (max-width: 900px) {
        .zs-panel {
          width: 210px;
        }
        .zs-cell {
          flex-basis: 68px;
          width: 68px;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>

    <div id="boot">
      <div>SURVEYING THE DESERT</div>
      <div class="bar"><i></i></div>
    </div>

    <!-- The engine core knows nothing about this game: the boil, the
         spatial hash, the camera, the audio. -->
    <script src="js/sketch.js"></script>
    <script src="js/grid.js"></script>
    <script src="js/camera.js"></script>
    <script src="js/sound.js"></script>
    <script src="js/village/perf.js"></script>

    <!-- The RTS. Order matters: core, world, tables, systems, then boot. -->
    <script src="js/rts/core.js"></script>
    <script src="js/rts/camera.js"></script>
    <script src="js/rts/terrain.js"></script>
    <script src="js/rts/nav.js"></script>
    <script src="js/rts/defs.js"></script>
    <script src="js/rts/game.js"></script>
    <script src="js/rts/fx.js"></script>
    <script src="js/rts/combat.js"></script>
    <script src="js/rts/entity.js"></script>
    <script src="js/rts/base.js"></script>
    <script src="js/rts/economy.js"></script>
    <script src="js/rts/territory.js"></script>
    <script src="js/rts/ai.js"></script>
    <script src="js/rts/horde.js"></script>
    <script src="js/rts/sprites.js"></script>
    <script src="js/rts/render.js"></script>
    <script src="js/rts/minimap.js"></script>
    <script src="js/rts/ui.js"></script>
    <script src="js/rts/main.js"></script>

    <script>
      // the world is generated before the first frame; drop the curtain
      // once the boot has actually finished
      window.addEventListener("load", function () {
        var b = document.getElementById("boot");
        if (b) b.remove();
      });
    </script>
  </body>
</html>
