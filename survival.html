<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
    />
    <title>The Village — zombie survival</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #efe8d8;
        transition: background 2.5s;
      }
      #c {
        display: block;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #ui {
        position: fixed;
        left: 14px;
        top: 14px;
        width: 268px;
        max-height: calc(100vh - 28px);
        overflow-y: auto;
        box-sizing: border-box;
        z-index: 5;
        background: #f6f1e3;
        border: 1.6px solid rgba(60, 50, 40, 0.55);
        border-radius: 6px;
        padding: 10px 12px 12px;
        font:
          17px "Segoe Script",
          "Bradley Hand",
          "Comic Sans MS",
          cursive;
        color: #3d342b;
        transform: rotate(-0.35deg);
        user-select: none;
        box-shadow: 2px 3px 0 rgba(60, 50, 40, 0.12);
        scrollbar-width: thin;
      }
      #ui .pile {
        font-size: 15px;
        line-height: 1.4;
        cursor: pointer;
        display: block;
        transition: transform 0.12s;
      }
      #ui .pile b {
        font-size: 18px;
      }
      #ui .pile.sq {
        transform: scale(0.96) rotate(-1deg);
      }
      #ui .day {
        margin-top: 4px;
        opacity: 0.85;
        font-size: 14px;
        line-height: 1.3;
      }
      #ui button {
        width: 100%;
        margin-top: 8px;
        padding: 4px 0;
        font:
          15px "Segoe Script",
          "Bradley Hand",
          "Comic Sans MS",
          cursive;
        background: rgba(112, 148, 72, 0.16);
        border: 1.4px solid rgba(60, 50, 40, 0.55);
        border-radius: 5px;
        cursor: pointer;
        color: #3d342b;
      }
      #ui button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      #ui #coreBtn {
        font-size: 13px;
        opacity: 0.75;
        background: rgba(60, 50, 40, 0.06);
      }
      #ui #coreBtn:hover {
        opacity: 1;
      }
      #ui #resetBtn {
        font-size: 13px;
        opacity: 0.75;
        background: rgba(160, 64, 48, 0.08);
      }
      #ui #resetBtn:hover {
        opacity: 1;
      }
      #ui #resetBtn.warn {
        opacity: 1;
        background: rgba(160, 64, 48, 0.3);
      }
      #ui .lbl {
        margin-top: 10px;
        font-style: italic;
        opacity: 0.7;
        font-size: 13px;
        display: flex;
        justify-content: space-between;
      }
      #ui .lbl .keys {
        font-style: normal;
        opacity: 0.6;
      }
      #ui .row {
        padding: 2px 5px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 4px;
      }
      #ui .row.on {
        background: rgba(112, 148, 72, 0.25);
      }
      #ui .row.lock {
        opacity: 0.45;
      }
      #ui .row .cost.no {
        color: #a04030;
      }
      #ui .row .prod {
        color: #5a7a3a;
        font-size: 11px;
      }
      #ui .row .cnt {
        font-size: 11px;
        opacity: 0.7;
      }
      #ui .jobrow {
        padding: 2px 5px;
        border-radius: 4px;
        font-size: 13px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 4px;
      }
      #ui .jobrow .jbtn {
        width: 22px;
        padding: 0;
        margin: 0;
        font-size: 13px;
        line-height: 18px;
        border-radius: 4px;
      }
      #ui .jobrow .jname {
        flex: 1;
      }
      #ui .jobrow .jcnt {
        min-width: 18px;
        text-align: center;
        font-weight: bold;
      }
      #ui .hint {
        margin-top: 8px;
        font-size: 11px;
        opacity: 0.55;
        line-height: 1.4;
      }
      #ui .toast {
        margin-top: 6px;
        font-size: 12px;
        min-height: 16px;
        opacity: 0.9;
        color: #6b3a2a;
      }
      #ui::-webkit-scrollbar {
        width: 6px;
      }
      #ui::-webkit-scrollbar-thumb {
        background: rgba(60, 50, 40, 0.2);
        border-radius: 3px;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="ui"></div>
    <script>
      var ZS_WW = 2000;
      var ZS_WH = 1400;
      var ZS_SCEN = "ScenarioSurvival";
    </script>
    <script src="js/sketch.js"></script>
    <script src="js/grid.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/camera.js"></script>
    <script src="js/world.js"></script>
    <script src="js/buildings.js"></script>
    <script src="js/stains.js"></script>
    <script src="js/tiles.js"></script>
    <script src="js/blocks.js"></script>
    <script src="js/agents.js"></script>
    <script src="js/sim.js"></script>
    <script src="js/scenarios/survival.js"></script>
    <script src="js/draw.js"></script>
    <script src="js/sound.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
